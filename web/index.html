<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15171c" />
  <title>Uzat — ekran</title>
  <link rel="stylesheet" href="/web.css" />
</head>
<body>
  <video id="video" playsinline autoplay muted></video>

  <main class="panel" id="panel">
    <div class="card">
      <div class="logo"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg></div>
      <h1 id="title">Ekranni ko'rish</h1>
      <p class="sub" id="sub">Kompyuterdagi Uzat oynasida ko'rsatilgan PIN kodni kiriting.</p>
      <form id="pinForm" autocomplete="off">
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="• • • •" aria-label="PIN kod" />
        <button type="submit" id="go" aria-label="Ulanish">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </form>
      <div class="msg" id="msg"></div>
      <div class="spinner" id="spinner" hidden></div>
    </div>
  </main>

  <div class="hud" id="hud" hidden>
    <span class="who"><i></i><b id="who">…</b></span>
    <span class="stat" id="stat"></span>
    <button type="button" id="soundBtn" hidden>🔊 Ovoz</button>
    <button type="button" id="kbBtn" hidden title="Klaviatura">⌨</button>
    <button type="button" id="fsBtn" title="To'liq ekran">⛶</button>
  </div>
  <div class="tap" id="tap" hidden>Ekranga bosing — to'liq ekran</div>

  <form class="kb" id="kb" hidden autocomplete="off">
    <input id="kbText" placeholder="Matn yozing…" enterkeyhint="send" />
    <button type="submit" title="Yuborish">Yuborish</button>
    <button type="button" data-vk="8" title="O'chirish">⌫</button>
    <button type="button" data-vk="13" title="Enter">↵</button>
    <button type="button" id="kbClose" title="Yopish">✕</button>
  </form>

  <script src="/rtc.js"></script>
  <script src="/web.js"></script>
</body>
</html>
