<!doctype html>
<html><head><meta charset="utf-8"><title>E2E harakat</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
// Sinov uchun: har kadrda o'zgaradigan tasvir (60 fps), shunda ekran ulashish haqiqiy harakatni uzatadi.
const c = document.getElementById('c'), x = c.getContext('2d');
let n = 0;
function f() {
  c.width = innerWidth; c.height = innerHeight;
  x.fillStyle = `hsl(${n % 360},60%,20%)`; x.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 40; i++) {
    const a = n / 30 + i;
    x.fillStyle = `hsl(${(n * 3 + i * 9) % 360},80%,60%)`;
    x.beginPath(); x.arc(c.width / 2 + Math.cos(a) * i * 9, c.height / 2 + Math.sin(a * 1.3) * i * 6, 14, 0, 7); x.fill();
  }
  x.fillStyle = '#fff'; x.font = 'bold 48px Segoe UI'; x.fillText('kadr ' + n, 30, 70);
  n++; requestAnimationFrame(f);
}
f();
</script></body></html>
